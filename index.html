<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Product Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f8f9fa;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    #ar-button {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 16px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>

<model-viewer 
  id="ar-viewer"
  src="" 
  ar 
  ar-modes="scene-viewer webxr quick-look" 
  camera-controls 
  touch-action="pan-y" 
  alt="3D AR Product Model"
  shadow-intensity="1"
  auto-rotate>
  
  <button slot="ar-button" id="ar-button">
    👋 View in Your Space (AR)
  </button>
</model-viewer>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const modelName = urlParams.get('model');
  const viewer = document.getElementById('ar-viewer');

  if (modelName) {
    viewer.src = `./models/${modelName}/${modelName}_scaled.glb`;
  }
</script>

</body>
</html>
