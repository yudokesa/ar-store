<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Product Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body style="margin: 0; background-color: #f8f9fa; height: 100vh; display: flex; justify-content: center; align-items: center;">

  <model-viewer 
    id="viewer"
    ar 
    ar-modes="scene-viewer quick-look webxr" 
    camera-controls 
    auto-rotate
    shadow-intensity="1" 
    style="width: 100%; height: 100%;">
    
    <button slot="ar-button" style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 14px 28px; font-size: 16px; font-weight: bold; background-color: #007bff; color: white; border: none; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer;">
      📱 View in Your Room (AR)
    </button>
  </model-viewer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modelName = urlParams.get('model');
    const viewer = document.getElementById('viewer');

    if (modelName) {
      viewer.src = `models/${modelName}/${modelName}_scaled.glb`;
      viewer.setAttribute('ios-src', `models/${modelName}/${modelName}.usdz`);
    } else {
      document.body.innerHTML = '<h2 style="font-family:sans-serif;text-align:center;">No product specified.</h2>';
    }
  </script>

</body>
</html>
